<!doctype html>
<html lang="{{ site.locale | default: site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {%- if page.title -%}
        {{ page.title }} | {{ site.title }}
      {%- else -%}
        {{ site.title }}
      {%- endif -%}
    </title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/archive/' | relative_url }}">Blog</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/cv-download/' | relative_url }}">CV</a>
      </nav>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>{{ site.time | date: '%Y' }} {{ site.author.name | default: site.title }}</span>
      <span class="footer-links">
        {% if site.author.github %}
          <a href="{% if site.author.github contains '://' %}{{ site.author.github }}{% else %}https://github.com/{{ site.author.github }}{% endif %}">GitHub</a>
        {% endif %}
        {% if site.author.googlescholar %}
          <a href="{{ site.author.googlescholar }}">Scholar</a>
        {% endif %}
        {% if site.author.email %}
          <a href="mailto:{{ site.author.email }}">Email</a>
        {% endif %}
      </span>
    </footer>
  </body>
</html>
